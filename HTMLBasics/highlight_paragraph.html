<!DOCTYPE html>
<!--
  File: highlight_paragraph.html
  Purpose: Task 8 - Highlight a word using <mark> and add a small note using <small>
-->

<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Highlight Example</title>
  </head>
  <body>
    <h1>Highlighting Text Example</h1>

    <p>
      Web development is a <mark>fun</mark> and creative activity.
      <br>
      <small>Updated recently</small>
    </p>
  </body>
</html>
