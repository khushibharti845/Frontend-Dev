<!DOCTYPE html>
<!--
  File: link_to_google.html
  Purpose: Task 2 - Add a hyperlink to Google
-->

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link to Google</title>
  </head>

  <body>
    <!-- Heading for the page -->
    <h1>Visit Google</h1>

    <!-- Hyperlink to Google that opens in a new tab -->
    <p>
      Click the link to go to
      <a href="https://www.google.com" target="_blank" title="Go to Google">
        Google Search
      </a>.
    </p>
  </body>
</html>
