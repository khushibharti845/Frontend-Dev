<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Offer Banner</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }
    .banner-container {
      position: relative;
      height: 300px;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 30px;
    }
    .banner {
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: white;
      text-align: center;
      padding: 40px;
      box-sizing: border-box;
      position: absolute;
      top: 0;
      left: 0;
    }
    .banner.active {
      display: flex;
    }
    .banner1 {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .banner2 {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    .banner3 {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }
    .banner4 {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }
    .banner5 {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    }
    .controls {
      text-align: center;
      margin-bottom: 20px;
    }
    .btn {
      padding: 12px 25px;
      margin: 5px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      color: white;
    }
    .btn-hide {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .btn-show {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }
    .btn-up {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    .btn-down {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }
    .btn-fade {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .banner-info {
      text-align: center;
      font-size: 18px;
      color: #666;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Special Offer Banners</h1>
    
    <div class="controls">
      <button class="btn btn-hide" id="hideBtn">Hide Banners</button>
      <button class="btn btn-show" id="showBtn">Show All Banners</button>
      <button class="btn btn-up" id="slideUpBtn">Slide Up</button>
      <button class="btn btn-down" id="slideDownBtn">Slide Down</button>
      <button class="btn btn-fade" id="fadeBtn">Fade In/Out</button>
    </div>

    <div class="banner-container">
      <div class="banner banner1 active" data-id="1">
        🎁 50% OFF on All Products! Limited Time Offer!
      </div>
      <div class="banner banner2" data-id="2">
        🚀 Free Shipping on Orders Over $50!
      </div>
      <div class="banner banner3" data-id="3">
        ⭐ Buy 2 Get 1 Free - This Weekend Only!
      </div>
      <div class="banner banner4" data-id="4">
        💎 Premium Membership - First Month Free!
      </div>
      <div class="banner banner5" data-id="5">
        🔥 Flash Sale - Up to 70% Off Selected Items!
      </div>
    </div>

    <div class="banner-info">
      <p>Current Banner: <span id="currentBanner">1</span> of 5</p>
    </div>
  </div>

  <script src="banner.js"></script>
</body>
</html>
