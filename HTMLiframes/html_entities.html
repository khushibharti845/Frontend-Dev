<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities Example</title>
</head>
<body>
    <h2>HTML Entities Demo</h2>

    <p>
        Displaying special characters using HTML entities:<br>
        Less than: &lt; <br>
        Greater than: &gt; <br>
        Ampersand: &amp; <br>
        Double Quote: &quot; <br>
        Single Quote: &apos; <br><br>

        Displaying symbols:<br>
        Copyright: &copy; <br>
        Trademark: &trade; <br>
        Registered: &reg;
    </p>
</body>
</html>
