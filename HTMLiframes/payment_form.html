<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
</head>
<body>
    <h2>Payment Form</h2>

    <form method="post" action="#">
        <!-- Cardholder Name -->
        <label for="cardname">Cardholder Name:</label><br>
        <input type="text" id="cardname" name="cardname" placeholder="Enter cardholder name" required><br><br>

        <!-- Card Number -->
        <label for="cardnumber">Card Number:</label><br>
        <input type="text" id="cardnumber" name="cardnumber" placeholder="XXXX-XXXX-XXXX-XXXX" required pattern="\d{16}"><br><br>

        <!-- Expiry Date -->
        <label for="expiry">Expiry Date:</label><br>
        <input type="month" id="expiry" name="expiry" required><br><br>

        <!-- CVV -->
        <label for="cvv">CVV:</label><br>
        <input type="password" id="cvv" name="cvv" placeholder="XXX" required pattern="\d{3}"><br><br>

        <!-- Submit Button -->
        <button type="submit">Pay Now</button>
    </form>
</body>
</html>
