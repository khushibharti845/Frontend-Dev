<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Example</title>
</head>
<body>
    <h2>Embedded Website Example</h2>

    <!-- Iframe embedding Wikipedia -->
    <iframe 
        src="https://www.wikipedia.org" 
        width="800" 
        height="500" 
        style="border:1px solid #ccc;">
    </iframe>

    <p>Some websites may not allow embedding for security reasons.</p>
</body>
</html>
