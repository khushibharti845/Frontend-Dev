<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Form</title>
</head>
<body>
    <h2>Upload Your Image</h2>

    <!-- Note about allowed files -->
    <p>Only image files with <strong>.jpg</strong> or <strong>.png</strong> extensions are allowed.</p>

    <!-- File Upload Form -->
    <form method="post" action="#" enctype="multipart/form-data">
        <label for="fileUpload">Choose an image:</label><br><br>
        <input type="file" id="fileUpload" name="fileUpload" accept=".jpg, .png" required><br><br>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
