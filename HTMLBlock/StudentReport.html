<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Report</title>
</head>
<body>
  <h1>Sunrise High School</h1>

  <table border="1" cellpadding="6" cellspacing="0" title="Student marks report table">
    <thead>
      <tr>
        <th rowspan="2">Student Name</th>
        <th colspan="5">Subjects</th>
        <th rowspan="2">Total</th>
        <th rowspan="2">Percentage</th>
      </tr>
      <tr>
        <th>Mathematics</th>
        <th>Physics</th>
        <th>Chemistry</th>
        <th>Biology</th>
        <th>English</th>
      </tr>
    </thead>
    <tbody>
      <tr title="John Doe marks">
        <td>John Doe</td>
        <td>85</td>
        <td>78</td>
        <td>82</td>
        <td>90</td>
        <td>88</td>
        <td>423</td>
        <td>84.6%</td>
      </tr>
      <tr title="Jane Smith marks">
        <td>Jane Smith</td>
        <td>92</td>
        <td>85</td>
        <td>89</td>
        <td>87</td>
        <td>90</td>
        <td>443</td>
        <td>88.6%</td>
      </tr>
      <tr title="Robert Brown marks">
        <td>Robert Brown</td>
        <td>75</td>
        <td>80</td>
        <td>78</td>
        <td>82</td>
        <td>85</td>
        <td>400</td>
        <td>80%</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="5" style="text-align:center;">Total & Percentage</td>
        <td colspan="3">Displayed above for each student</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
